<!DOCTYPE html>
<html>

<head>
    <title>Pancreatic Cancer Prediction</title>
    <!-- <link rel="stylesheet" href="css.css">
    <script src="js.js" defer></script> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css.css') }}">
    <script src="{{ url_for('static', filename='js.js') }}" defer></script>

</head>

<body>
    <div class="container">
        <h2>Enter Patient Details</h2>
        <form id="predictForm" method="POST" action="/predict">
            <input type="number" name="age" placeholder="Age" required><br>
            <!-- <input type="number" name="sex" placeholder="Sex (1=Male, 0=Female)" required><br> -->
            <input type="number" name="sex" placeholder="Sex (1=Male, 0=Female)" min="0" max="1" step="1" required oninput="this.value = (this.value > 1) ? 1 : (this.value < 0 ? 0 : this.value)">


            <input type="number" step="any" name="creatinine" placeholder="Creatinine" required><br>
            <input type="number" step="any" name="plasma_CA19_9" placeholder="Plasma CA19-9" required><br>
            <input type="number" step="any" name="LYVE1" placeholder="LYVE1" required><br>
            <input type="number" step="any" name="REG1B" placeholder="REG1B" required><br>
            <input type="number" step="any" name="TFF1" placeholder="TFF1" required><br>
            <button type="submit">Predict</button>
        </form>

        <!-- {% if result %}
        <div class="result">Prediction: {{ result }}</div>
        {% endif %} -->

        <!-- {% if result %}
        <div class="result {{ result_class }}">Prediction: {{ result }}</div>
        {% endif %} -->

        <!-- {% if result %}
        <div class="result {{ result_class }}">
            Prediction: {{ result }}<br> {% if accuracy %}
            <span class="accuracy">{{ accuracy }}</span> {% endif %}
        </div>
        {% endif %} -->

        {% if result %}
        <div class="result {{ result_class }}">
            Prediction: {{ result }}<br> {% if accuracy %}
            <span class="accuracy">Model Accuracy: {{ accuracy }}</span> {% endif %}
        </div>
        {% endif %}



    </div>
</body>

</html>
